# ==================================================================
# Dify 1.19.0 - Coolify deployment file (rafalNht)
# Derived from docker/docker-compose.yaml + docker/envs/**/*.defaults (upstream 1.19.0).
#
# Why a separate file:
# - Coolify replaces every service's env_file with [.env], so the upstream
#   *.defaults files would be ignored. Their values are inlined below.
# - Only the services we run are kept (core + postgresql + weaviate), no profiles.
# - No host ports: the domain is attached to the nginx service in Coolify.
# - Per-service resource limits (~12g memory total), cpu_shares 128, pinned to cores 8-11.
#
# Coolify settings this file needs:
# - Base Directory: /docker
# - Docker Compose Location: /docker-compose.coolify.yaml
# - "Preserve Repository During Deployment" ON (nginx/ssrf_proxy/sandbox config files are read from the repo).
#
# On a Dify upgrade: compare upstream docker-compose.yaml and envs/*.defaults with this file.
# ==================================================================

x-api-worker-env: &api-worker-env
  # --- secrets (generated by Coolify) ---
  SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
  DB_PASSWORD: ${SERVICE_PASSWORD_DB}
  REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
  PLUGIN_DAEMON_KEY: ${SERVICE_PASSWORD_64_PLUGINDAEMON}
  INNER_API_KEY_FOR_PLUGIN: ${SERVICE_PASSWORD_64_INNERAPI}
  WEAVIATE_API_KEY: ${SERVICE_PASSWORD_64_WEAVIATE}
  CODE_EXECUTION_API_KEY: ${SERVICE_PASSWORD_SANDBOX}
  DIFY_AGENT_API_TOKEN: ${SERVICE_PASSWORD_64_AGENTAPI}
  AGENT_BACKEND_API_TOKEN: ${SERVICE_PASSWORD_64_AGENTAPI}
  CELERY_BROKER_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/1
  # --- public URLs (domain set on the nginx service in Coolify) ---
  FILES_URL: ${SERVICE_URL_NGINX}
  TRIGGER_URL: ${SERVICE_URL_NGINX}
  ENDPOINT_URL_TEMPLATE: ${SERVICE_URL_NGINX}/e/{hook_id}
  # --- envs/core-services/api-worker.defaults ---
  MIGRATION_ENABLED: "true"
  CONSOLE_CORS_ALLOW_ORIGINS: "*"
  SERVER_WORKER_CLASS: gevent
  GUNICORN_TIMEOUT: "360"
  CELERY_WORKER_AMOUNT: "2"
  DB_HOST: db_postgres
  DB_USERNAME: postgres
  DB_DATABASE: dify
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_KEEPALIVE: "true"
  LOG_FILE: /app/logs/server.log
  LOG_DATEFORMAT: "%Y-%m-%d %H:%M:%S"
  PLUGIN_DAEMON_URL: http://plugin_daemon:5002
  PLUGIN_MAX_PACKAGE_SIZE: "52428800"
  PLUGIN_DAEMON_TIMEOUT: "600.0"
  AGENT_BACKEND_BASE_URL: http://agent_backend:5050
  NEXT_PUBLIC_ENABLE_AGENT_V2: "true"
  SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  OPENDAL_FS_ROOT: storage
  VECTOR_STORE: weaviate
  WEAVIATE_ENDPOINT: http://weaviate:8080
  WEAVIATE_GRPC_ENDPOINT: grpc://weaviate:50051
  RESPECT_XFORWARD_HEADERS_ENABLED: "true"
  PLUGIN_REMOTE_INSTALL_HOST: localhost
  PLUGIN_REMOTE_INSTALL_PORT: "5003"

x-api-worker-common: &api-worker-common
  image: langgenius/dify-api:1.19.0
  restart: always
  volumes:
    - dify_storage:/app/api/storage
  networks:
    - ssrf_proxy_network
    - default

services:
  init_permissions:
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        for DIR in /app/api/storage /app/plugin_daemon/storage; do
          FLAG_FILE="$${DIR}/.init_permissions"
          if [ -f "$${FLAG_FILE}" ]; then
            echo "Permissions already initialized for $${DIR}."
            continue
          fi
          echo "Initializing permissions for $${DIR}"
          chown -R 1001:1001 "$${DIR}" && touch "$${FLAG_FILE}" || exit 1
        done
        echo "Permissions initialized. Exiting."
    volumes:
      - dify_storage:/app/api/storage
      - dify_plugin_daemon:/app/plugin_daemon/storage
    restart: "no"
    exclude_from_hc: true

  api:
    <<: *api-worker-common
    cpu_shares: 128
    cpuset: "8-11"
    environment:
      <<: *api-worker-env
      MODE: api
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536m }
        reservations: { memory: 512m }

  worker:
    <<: *api-worker-common
    cpu_shares: 128
    cpuset: "8-11"
    environment:
      <<: *api-worker-env
      MODE: worker
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_healthcheck.celery inspect ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
      disable: true
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536m }
        reservations: { memory: 512m }

  worker_beat:
    <<: *api-worker-common
    cpu_shares: 128
    cpuset: "8-11"
    environment:
      <<: *api-worker-env
      MODE: beat
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_healthcheck.celery inspect ping"]
      disable: true
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 384m }
        reservations: { memory: 128m }

  web:
    cpu_shares: 128
    cpuset: "8-11"
    image: langgenius/dify-web:1.19.0
    restart: always
    environment:
      # envs/core-services/web.defaults
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      SERVER_CONSOLE_API_URL: http://api:5001
      EXPERIMENTAL_ENABLE_VINEXT: "false"
      LOOP_NODE_MAX_COUNT: "100"
      MAX_TOOLS_NUM: "10"
      MAX_PARALLEL_LIMIT: "10"
      MAX_ITERATIONS_NUM: "99"
      TEXT_GENERATION_TIMEOUT_MS: "60000"
      ALLOW_UNSAFE_DATA_SCHEME: "false"
      MAX_TREE_DEPTH: "50"
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "4000"
      ALLOW_EMBED: "false"
      ENABLE_WEBSITE_JINAREADER: "true"
      ENABLE_WEBSITE_FIRECRAWL: "true"
      ENABLE_WEBSITE_WATERCRAWL: "true"
      NEXT_PUBLIC_ENABLE_AGENT_V2: "true"
      TOP_K_MAX_VALUE: "10"
      NEXT_TELEMETRY_DISABLED: "1"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1g }
        reservations: { memory: 256m }

  db_postgres:
    cpu_shares: 128
    cpuset: "8-11"
    image: postgres:15-alpine
    restart: always
    environment:
      # envs/databases/db-postgres.defaults (tuned for a 1.5g limit)
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB}
      POSTGRES_DB: dify
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1024MB
      POSTGRES_STATEMENT_TIMEOUT: "0"
      POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: "0"
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh postgres
        -c "max_connections=$$POSTGRES_MAX_CONNECTIONS"
        -c "shared_buffers=$$POSTGRES_SHARED_BUFFERS"
        -c "work_mem=$$POSTGRES_WORK_MEM"
        -c "maintenance_work_mem=$$POSTGRES_MAINTENANCE_WORK_MEM"
        -c "effective_cache_size=$$POSTGRES_EFFECTIVE_CACHE_SIZE"
        -c "statement_timeout=$$POSTGRES_STATEMENT_TIMEOUT"
        -c "idle_in_transaction_session_timeout=$$POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT"
    volumes:
      - dify_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h db_postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 3s
      retries: 60
    deploy:
      resources:
        limits: { cpus: "1", memory: 1536m }
        reservations: { memory: 512m }

  redis:
    cpu_shares: 128
    cpuset: "8-11"
    image: redis:6-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      REDISCLI_AUTH: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - dify_redis:/data
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384m }
        reservations: { memory: 128m }

  sandbox:
    cpu_shares: 128
    cpuset: "8-11"
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    environment:
      # envs/core-services/sandbox.defaults
      API_KEY: ${SERVICE_PASSWORD_SANDBOX}
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: "8194"
      PIP_MIRROR_URL: ""
    volumes:
      - dify_sandbox_dependencies:/dependencies
      - ./volumes/sandbox/conf:/conf
    healthcheck:
      test: ["CMD-SHELL", 'curl -f "http://localhost:$$SANDBOX_PORT/health"']
    networks:
      - ssrf_proxy_network
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
        reservations: { memory: 128m }

  local_sandbox:
    cpu_shares: 128
    cpuset: "8-11"
    image: langgenius/dify-agent-local-sandbox:1.19.0
    command: ["shellctl", "serve", "--listen", "0.0.0.0:5004", "--require-auth-token"]
    restart: always
    environment:
      SHELLCTL_AUTH_TOKEN: ${SERVICE_HEX_32_SHELLCTL}
      HTTP_PROXY: http://agent_ssrf_proxy:3128
      HTTPS_PROXY: http://agent_ssrf_proxy:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - dify_agent_local_sandbox_home:/home/dify
      - dify_agent_local_sandbox_workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent_sandbox_network
      - local_sandbox_proxy_network
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
        reservations: { memory: 128m }

  plugin_daemon:
    cpu_shares: 128
    cpuset: "8-11"
    image: langgenius/dify-plugin-daemon:0.6.14-local
    restart: always
    environment:
      # envs/core-services/plugin-daemon.defaults (local storage only)
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${SERVICE_PASSWORD_DB}
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      SERVER_PORT: "5002"
      SERVER_KEY: ${SERVICE_PASSWORD_64_PLUGINDAEMON}
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${SERVICE_PASSWORD_64_INNERAPI}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: "true"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PLUGIN_STDIO_BUFFER_SIZE: "1024"
      PLUGIN_STDIO_MAX_BUFFER_SIZE: "5242880"
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_MEDIA_CACHE_PATH: assets
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      PPROF_ENABLED: "false"
      SENTRY_ENABLED: "false"
      PIP_MIRROR_URL: ""
    volumes:
      - dify_plugin_daemon:/app/storage
    networks:
      - ssrf_proxy_network
      - default
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: 1536m }
        reservations: { memory: 256m }

  agent_backend:
    cpu_shares: 128
    cpuset: "8-11"
    image: langgenius/dify-agent-backend:1.19.0
    restart: always
    environment:
      # envs/core-services/dify-agent.defaults
      DIFY_AGENT_API_TOKEN: ${SERVICE_PASSWORD_64_AGENTAPI}
      DIFY_AGENT_REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/2
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${SERVICE_PASSWORD_64_PLUGINDAEMON}
      DIFY_AGENT_INNER_API_URL: http://api:5001
      DIFY_AGENT_INNER_API_KEY: ${SERVICE_PASSWORD_64_INNERAPI}
      DIFY_AGENT_RUNTIME_BACKEND: local
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${SERVICE_HEX_32_SHELLCTL}
      DIFY_AGENT_SANDBOX_FILES_BASE_URL: http://api:5001
      DIFY_AGENT_STUB_API_BASE_URL: http://agent_backend:5050/agent-stub
      DIFY_AGENT_SERVER_SECRET_KEY: ${SERVICE_REALBASE64_32_AGENTSERVER}
    depends_on:
      redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    networks:
      - default
      - agent_sandbox_network
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
        reservations: { memory: 128m }

  agent_ssrf_proxy:
    cpu_shares: 128
    cpuset: "8-11"
    image: ubuntu/squid:latest
    restart: always
    environment: &ssrf-env
      # envs/infrastructure/ssrf-proxy.defaults
      HTTP_PORT: "3128"
      COREDUMP_DIR: /var/spool/squid
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ""
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ""
    volumes:
      - ./ssrf_proxy/squid-agent.conf.template:/etc/squid/squid.conf.template
      - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
      - ./ssrf_proxy/docker-agent-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    networks:
      - default
      - local_sandbox_proxy_network
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { memory: 64m }

  ssrf_proxy:
    cpu_shares: 128
    cpuset: "8-11"
    image: ubuntu/squid:latest
    restart: always
    environment: *ssrf-env
    volumes:
      - ./ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
      - ./ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    networks:
      - ssrf_proxy_network
      - default
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { memory: 64m }

  nginx:
    cpu_shares: 128
    cpuset: "8-11"
    image: nginx:1.29-alpine
    restart: always
    environment:
      # Coolify: attach the public domain to this service on port 80.
      SERVICE_URL_NGINX_80: ""
      # envs/infrastructure/nginx.defaults (TLS is terminated by the Coolify proxy)
      NGINX_SERVER_NAME: _
      NGINX_PORT: "80"
      NGINX_SSL_PORT: "443"
      NGINX_HTTPS_ENABLED: "false"
      NGINX_SSL_CERT_FILENAME: dify.crt
      NGINX_SSL_CERT_KEY_FILENAME: dify.key
      NGINX_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      NGINX_WORKER_PROCESSES: auto
      NGINX_CLIENT_MAX_BODY_SIZE: 100M
      NGINX_KEEPALIVE_TIMEOUT: "65"
      NGINX_PROXY_READ_TIMEOUT: 3600s
      NGINX_PROXY_SEND_TIMEOUT: 3600s
      NGINX_ENABLE_CERTBOT_CHALLENGE: "false"
      NGINX_SOCKET_IO_UPSTREAM: api_websocket:5001
      CERTBOT_DOMAIN: ""
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template
      - ./nginx/https.conf.template:/etc/nginx/https.conf.template
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { memory: 64m }

  weaviate:
    cpu_shares: 128
    cpuset: "8-11"
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    restart: always
    environment:
      # envs/vectorstores/weaviate.defaults
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${SERVICE_PASSWORD_64_WEAVIATE}
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
      DISABLE_TELEMETRY: "true"
      ENABLE_TOKENIZER_GSE: "false"
      ENABLE_TOKENIZER_KAGOME_JA: "false"
      ENABLE_TOKENIZER_KAGOME_KR: "false"
      GOMEMLIMIT: 1600MiB
    volumes:
      - dify_weaviate:/var/lib/weaviate
    deploy:
      resources:
        limits: { cpus: "1", memory: 2g }
        reservations: { memory: 512m }

networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
  agent_sandbox_network:
    driver: bridge
    internal: true

volumes:
  dify_storage:
  dify_plugin_daemon:
  dify_db:
  dify_redis:
  dify_weaviate:
  dify_sandbox_dependencies:
  dify_agent_local_sandbox_home:
  dify_agent_local_sandbox_workspace:
